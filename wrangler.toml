name = "shindora-standalone-worker"
main = "cloudflare-worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static Assets Directory
[assets]
directory = "./public"

[vars]
STANDALONE = "true"
ORIGIN_URL = ""

[[d1_databases]]
binding = "DB"
database_name = "shindora-db"
database_id = "shindora-d1-database-id"
